<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Landing Page</title>
    <link rel="stylesheet" href="P3_styling.css">
</head>
<body>
    <div class = "content-wrap">
        <!-- Puts a static banner accros the top of the screen -->
        <header>
            <div class = "P3_banner">P3</div>
        </header>

        <!-- class made to resolve issue with side border extending into banner -->
        <div class = "below-banner-content-wrap">
            <!-- Creates tabs for landing page navigation -->
            <nav class="tabs" role="tablist">
                <button class = "nav-tab active" role = "tab" data-target = "post-tab">Postings</button>
                <button class = "nav-tab" role = "tab" data-target = "applicants-tab">Applicants</button>
            </nav>
        
            <!-- Content of each tab -->
            <main>
                <section id = "post-tab" class = "tab-content active" role = "tabpanel">
                    <h1>Your Mentorship Postings</h1>
                    <p>See who has applied to be your shadow</p>
                </section>
                <section id = "applicants-tab" class = "tab-content" role = "tabpanel">
                    <h1>Your Applicants</h1>
                    <p>Manage your applicants</p>
                </section>
            </main>
        </div>
    </div>

    <!-- Makes buttons functional -->
    <script>
        const tab_buttons = document.querySelectorAll('.nav-tab');
        const tab_contents = document.querySelectorAll('.tab-content');

        tab_buttons.forEach(butn =>
        {
            butn.addEventListener('click', () =>
            {
                tab_buttons.forEach(btn => btn.classList.remove('active'));
                tab_contents.forEach(cont => cont.classList.remove('active'));

                butn.classList.add('active');
                document.getElementById(butn.dataset.target).classList.add('active');
            });
        });
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>
