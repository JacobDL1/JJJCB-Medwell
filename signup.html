<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="P3_styling.css">
</head>
<body>
    <div class = "content-wrap">
        <!-- Same banner as the landing page -->
        <header>
            <div class = "P3_banner">P3</div>
        </header>

        <div class = "below-banner-content-wrap">
            <main class = "tab-content active">
                <h1>Sign Up</h1>

                <!-- Sign up form -->
                <form action="login.html">
                    <input type="hidden" name="type" value="user">
                    <p><label>First name: <input required></label></p>
                    <p><label>Last name: <input required></label></p>
                    <p><label>Email: <input type = "email" required></label></p>
                    <p><label>Password: <input type = "password" minlength = "8" required></label></p>
                    <button type = "submit" class = "form-button">Sign Up</button>
                </form>
                <br>
                <p>Want to signup for P3 as a sponsor or non-profit? Contact us at changelater@gmail.com to get started!</p>
                <br>
                <a href="index.html?">Already have an account? Return to account selection here!</a>
            </main>
        </div>
    </div>
</body>
</html>
