<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Landing Page</title>
    <link rel="stylesheet" href="../css/P3_styling.css">
</head>
<body class="dashboard-page">
    <div class = "content-wrap">
        <!-- Puts a static banner accros the top of the screen -->
<header>
    <a class="P3_banner" href="admin_landingpage.html">
        <span class="brand-mark">P3<span>+</span></span>
        <span>
            Medwell
            <span class="brand-sub">PARTICIPATE. PREVENT. PROGRESS.</span>
        </span>
    </a>

    <span class="header-note">Admin Portal</span>

    <div style="display: flex; gap: 15px; align-items: center;">
        <button type="button" class="theme-toggle" aria-pressed="false">
            🌙 Dark mode
        </button>

        <div class="settings-menu">
            <button class="settings-btn">⚙️ Settings</button>
            <div class="settings-dropdown">
                <a href="#">My Profile</a>
                <a href="#" id="logout-btn">Logout</a>
            </div>
        </div>
    </div>
</header>

        <!-- class made to resolve issue with side border extending into banner -->
        <div class = "below-banner-content-wrap">
            <!-- Creates tabs for landing page navigation -->
            <nav class="tabs" role="tablist">
                <button class = "nav-tab active" role = "tab" data-target = "approval-tab">Approvals</button>
                <button class = "nav-tab" role = "tab" data-target = "registered-sponsors-tab">Sponsors</button>
                <button class = "nav-tab" role = "tab" data-target = "registered-nonprofits-tab">Non-Profits</button>
                <button class = "nav-tab" role = "tab" data-target = "account-creation-tab">Account</button>
            </nav>
        
            <!-- Content of each tab -->
            <main>
                <section id = "approval-tab" class = "tab-content active" role = "tabpanel">
                    <h1>Approval Requests</h1>
                </section>
                
                <section id = "registered-sponsors-tab" class = "tab-content" role = "tabpanel">
                    <h1>Registered Sponsors</h1>
                    <div id="sponsor-list"></div>
                </section>
        
                <section id = "registered-nonprofits-tab" class = "tab-content" role = "tabpanel">
                    <h1>Registered Non-Profits</h1>
                </section>

                <section id = "account-creation-tab" class = "tab-content" role = "tabpanel">
                    <h1>Account Creation</h1>
                </section>
            </main>
        </div>
    </div>

    <!-- Makes buttons functional -->
    <script>
        const tab_buttons = document.querySelectorAll('.nav-tab');
        const tab_contents = document.querySelectorAll('.tab-content');

        tab_buttons.forEach(butn =>
        {
            butn.addEventListener('click', () =>
            {
                tab_buttons.forEach(btn => btn.classList.remove('active'));
                tab_contents.forEach(cont => cont.classList.remove('active'));

                butn.classList.add('active');
                document.getElementById(butn.dataset.target).classList.add('active');
            });
        });
    </script>

    <!-- Makes sure only verified users can access associated account type pages -->
<script type="module">
    import { supabase } from '../js/supabaseClient.js';
    import { logout, checkUserRole } from '../js/auth.js';

    async function init() {
        const user = await checkUserRole('admin');
        if (!user) return;

        document.getElementById('logout-btn')?.addEventListener('click', logout);

        const settingsBtn = document.querySelector('.settings-btn');
        const settingsDropdown = document.querySelector('.settings-dropdown');

        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsDropdown.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!settingsDropdown.contains(e.target)) {
                settingsDropdown.classList.remove('show');
            }
        });

                                async function loadAccounts(role, listId) {
            const list = document.getElementById(listId);
            list.textContent = 'Loading...';

            const { data: people, error } = await supabase
                .from('profiles')
                .select('first_name, last_name, organizations:org_id ( org_name )')
                .eq('role', role);

            if (error) {
                console.error(error);
                list.textContent = 'Could not load accounts.';
                return;
            }
            if (people.length === 0) {
                list.textContent = 'None registered yet.';
                return;
            }

            list.innerHTML = '';
            for (const x of people) {
                const card = document.createElement('div');
                card.className = 'post-card';

                const org = document.createElement('h3');
                org.textContent = x.organizations?.org_name ?? 'No organization yet';
                const name = document.createElement('p');
                name.textContent = (x.first_name ?? '') + ' ' + (x.last_name ?? '');

                card.append(org, name);
                list.append(card);
            }
        }

        loadAccounts('sponsor', 'sponsor-list');
    }
    init();
</script>

<script src="../js/design.js" defer></script>

</body>
</html>
