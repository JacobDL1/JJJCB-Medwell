<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../css/P3_styling.css">
</head>
<body>
    <div class = "content-wrap">
        <!-- Same banner as the landing page -->
        <header>
            <div class = "P3_banner">P3</div>
        </header>

        <div class = "below-banner-content-wrap">
            <main class = "tab-content active">
                <h1>Sign Up</h1>

                <!-- Sign up form -->
                <form id="signup-form">
                    <p><label>First name: <input id = "first-name" required></label></p>
                    <p><label>Last name: <input id = "last-name" required></label></p>
                    <p><label>Email: <input type = "email" id = "email" required></label></p>
                    <p><label>Password: <input type = "password" id = "password" minlength = "8" required></label></p>
                    <p id="message" style="color: red;"></p>
                    <button type = "submit" class = "form-button">Sign Up</button>
                </form>
                <br>
                <p>Want to signup for P3 as a sponsor or non-profit? Contact us at changelater@gmail.com to get started!</p>
                <br>
                <a href="../index.html?">Already have an account? Return to account selection here!</a>
            </main>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../js/supabaseClient.js'

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault()

            const first_name = document.getElementById('first-name').value
            const last_name = document.getElementById('last-name').value
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            const message = document.getElementById('message')

            const { error } = await supabase.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        // "account_type": "user removed since my new auth trigger ignores metadata for role and always
                        // sets it to participant on signup -JC
                        first_name: first_name,
                        last_name: last_name
                    }
                }
            })

            if (error) {
                message.textContent = error.message
                return
            }

            window.location.href = '../index.html'
        })
    </script>
</body>
</html>
