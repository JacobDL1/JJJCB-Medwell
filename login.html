<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="P3_styling.css">
</head>
<body>
    <div class = "content-wrap">
        <!-- Same banner as the landing page -->
        <header>
            <div class = "P3_banner">P3</div>
        </header>

        <div class = "below-banner-content-wrap">
            <main class = "tab-content active">
                <h1>Log In</h1>

                <!-- Login form -->
                <form onsubmit = "return false">
                    <p><label>Email <input type = "email" required></label></p>
                    <p><label>Password <input type = "password" required></label></p>
                    <button type = "submit">Log In</button>
                </form>
            </main>
        </div>
    </div>
</body>
</html>
