<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="P3_styling.css">
</head>
<body>
    <div class = "content-wrap">
        <!-- Same banner as the landing page -->
        <header>
            <div class = "P3_banner">P3</div>
        </header>

        <div class = "below-banner-content-wrap">
            <main class = "tab-content active">
                <h1>Log In</h1>

                <!-- Login form -->
                <form id = "login-form">
                    <p><label>Email: <input type = "email" id = "email" required></label></p>
                    <p><label>Password: <input type = "password" id = "password" required></label></p>
                    <p id="error-message" style="color: red;"></p>
                    <button type = "submit" class = "form-button">Log In</button>
                </form>
                <br>
                <a href="signup.html">No account? Sign up here!</a>
            </main>
        </div>
    </div>

    <!-- Connection to backend to verify credentials -->
    <script type="module">
        import { supabase } from './supabaseClient.js'

        const route =
        {
            user: 'user_landingpage.html',
            admin: 'admin_landingpage.html',
            sponsor: 'sponsor_landingpage.html',
            'non-profit': 'nonprofit_landingpage.html',
            mentor: 'mentor_landingpage.html'
        }
    
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault()
    
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            const type = new URLSearchParams(window.location.search).get('type')
            const errorBox = document.getElementById('error-message')
    
            // Step 1: Auth checks the password
            const { data, error } = await supabase.auth.signInWithPassword({ email, password })
            if (error) {
                errorBox.textContent = error.message
                return
            }
    
            // Step 2: look up their account type in your table
            const { data: row, error: rowError } = await supabase
                .schema('user_accounts')
                .from('login_credentials')
                .select('account_type')
                .eq('id', data.user.id)
                .single()
    
            if (rowError || !row) {
                errorBox.textContent = 'Could not load your account type'
                return
            }
    
            if (type && row.account_type !== type) {
                errorBox.textContent = 'This is not a ' + type + ' account'
                return
            }
    
            window.location.href = route[row.account_type]
        })
    </script>
</body>
</html>
