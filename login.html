<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="P3_styling.css">
</head>
<body>
    <div class = "content-wrap">
        <!-- Same banner as the landing page -->
        <header>
            <div class = "P3_banner">P3</div>
        </header>

        <div class = "below-banner-content-wrap">
            <main class = "tab-content active">
                <h1>Log In</h1>

                <!-- Login form -->
                <form onsubmit = "handleLogin(); return false">
                    <p><label>Email: <input type = "email" required></label></p>
                    <p><label>Password: <input type = "password" required></label></p>
                    <button type = "submit">Log In</button>
                </form>
                <br>
                <a href="signup.html">No account? Sign up here!</a>
            </main>
        </div>
    </div>

    <script>
        function handleLogin()
        {
            const get_URL_type = new URLSearchParams(window.location.search);
            const type = get_URL_type.get('type');

            const route = 
            {
                user: 'user_landingpage.html',
                admin: 'admin_landingpage.html',
                sponsor: 'sponsor_landingpage.html',
                'non-profit': 'nonprofit_landingpage.html'
            };

            window.location.href = route[type];
        }
    </script>
</body>
</html>
