<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
</head>
<body>
    <!-- Creates tabs for landing page navigation -->
    <nav class="tabs" role="tablist">
        <button class="nav-tab active" role="tab" data-target="events-tab">Events</button>
        <button class="nav-tab active" role="tab" data-target="prevention-tab">Prevention</button>
        <button class="nav-tab active" role="tab" data-target="shadowing-tab">Shadowing</button>
    </nav>

    <!-- Content of each tab -->
    <main>
        <section id="events-tab" class="events-content active" role="tabpanel">
            <h1>See What Events Are Happening In Your Community</h1>
        </section>
        
        <section id="prevention-tab" class="prevention-content" role="tabpanel">
            <h1>Close The Gap Between Prevention And Treatment</h1>
            <p>Learn about different illnesses, conditions, and diseases</p>
        </section>

        <section id="shadowing-tab" class="eshadowing-content" role="tabpanel">
            <h1>Find A Professional To Shadow</h1>
        </section>
    </main>
</body>
</html>
