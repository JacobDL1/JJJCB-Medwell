<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="P3_styling.css">
</head>
<body>
    <div class = "content-wrap">
        <!-- Puts a static banner accros the top of the screen -->
        <header>
            <div class = "P3_banner">P3</div>
        </header>

        <!-- class for addressing css styling below the P3 banner -->
        <div class = "below-banner-content-wrap">
            <!-- Class for styling/formatting welcome text -->
           <div class = "welcome-text">
               <h1>Welcome to P3!</h1>
               <p>Select you account type</p>

               <!-- Class for styling/formatting buttons -->
               <div class = "account-buttons">
                   <a href="login.html?type=user" class = "account-btn">User</a>
                   <a href="login.html?type=sponsor" class = "account-btn">Sponsor</a>
                   <a href="login.html?type=non-profit" class = "account-btn">Non-Profit</a>
                   <a href="login.html?type=admin" class = "account-btn">Administrator</a>
               </div>
           </div>
        </div>
    </div>
