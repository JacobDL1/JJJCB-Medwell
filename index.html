<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="css/P3_styling.css">
</head>
<body>
    <div class="content-wrap">
        <header>
            <div class="P3_banner">P3</div>
            <button class="theme-toggle" id="theme-toggle">Toggle Dark Mode</button>
        </header>

        <div class="below-banner-content-wrap">
            <main class="tab-content active">
                <h1>Welcome to P3!</h1>
                <form id="login-form">
                    <p><input type="email" id="email" placeholder="Email" required></p>
                    <p><input type="password" id="password" placeholder="Password" required></p>
                    <p id="error" style="color: red;"></p>
                    <button type="submit" class="form-button">Log In</button>
                </form>
                <br>
                <a href="pages/signup.html">No account? Sign up here!</a>
            </main>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabaseClient.js'

        const pages = {
            participant: 'user',
            sponsor: 'sponsor',
            nonprofit: 'nonprofit',
            mentor: 'mentor',
            admin: 'admin'
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault()
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value

            const { data, error } = await supabase.auth.signInWithPassword({ email, password })
            if (error) return document.getElementById('error').textContent = error.message

            const { data: profile } = await supabase
                .from('profiles').select('role').eq('user_id', data.user.id).single()

            window.location.href = `pages/${pages[profile.role]}_landingpage.html`
        })
    </script>
    <script src="js/design.js" defer></script>
</body>
</html>
