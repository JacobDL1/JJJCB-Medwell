<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sponsor Landing Page</title>
    <link rel="stylesheet" href="P3_styling.css">
</head>
<body>
    <div class = "content-wrap">
        <!-- Puts a static banner accros the top of the screen -->
        <header>
            <div class = "P3_banner">P3</div>
        </header>

        <!-- class made to resolve issue with side border extending into banner -->
        <div class = "below-banner-content-wrap">
            <!-- Creates tabs for landing page navigation -->
            <nav class="tabs" role="tablist">
                <button class = "nav-tab active" role = "tab" data-target = "sponsored-events-tab">Events</button>
                <button class = "nav-tab" role = "tab" data-target = "reporting-tab">Reporting</button>
            </nav>
        
            <!-- Content of each tab -->
            <main>
                <section id = "sponsored-events-tab" class = "tab-content active" role = "tabpanel">
                    <h1>See All Your Sponsored Events</h1>
                    <p>Manage your sponsored events</p>
                </section>
                
                <section id = "reporting-tab" class = "tab-content" role = "tabpanel">
                    <h1>Reporting Dashboard</h1>
                    <p>Review data and statistics from your events</p>
                </section>
            </main>
        </div>
    </div>

    <!-- Makes buttons functional -->
    <script>
        const tab_buttons = document.querySelectorAll('.nav-tab');
        const tab_contents = document.querySelectorAll('.tab-content');

        tab_buttons.forEach(butn =>
        {
            butn.addEventListener('click', () =>
            {
                tab_buttons.forEach(btn => btn.classList.remove('active'));
                tab_contents.forEach(cont => cont.classList.remove('active'));

                butn.classList.add('active');
                document.getElementById(butn.dataset.target).classList.add('active');
            });
        });
    </script>

    <!-- Makes sure only verified users can access associated account type pages -->
    <script type="module">
        import { supabase } from './supabaseClient.js'
    
        const REQUIRED_TYPE = 'sponsor'
    
        const { data: { session } } = await supabase.auth.getSession()
    
        if (!session)
        {
            window.location.href = 'index.html'
        }
        else
        {
            const { data: row } = await supabase
                .schema('user_accounts')
                .from('login_credentials')
                .select('account_type')
                .eq('id', session.user.id)
                .single()
    
            if (row?.account_type !== REQUIRED_TYPE)
            {
                window.location.href = 'index.html'
            }
        }
    </script>
</body>
</html>
